name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create CI local.properties
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_source="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk_source"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            apk_name="Audiophile-${GITHUB_REF_NAME}-release.apk"
          else
            apk_name="Audiophile-${GITHUB_SHA:0:7}-release.apk"
          fi
          mkdir -p release-artifact
          cp "$apk_source" "release-artifact/$apk_name"
          test -s "release-artifact/$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiophile-apk-${{ github.run_id }}
          path: release-artifact/${{ steps.apk.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: audiophile-apk-${{ github.run_id }}
          path: release-artifact

      - name: Verify downloaded APK
        shell: bash
        run: test -s "release-artifact/${{ needs.build.outputs.apk_name }}"

      - name: Create GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-artifact/${{ needs.build.outputs.apk_name }}" \
            --title "Audiophile ${GITHUB_REF_NAME}" \
            --generate-notes