name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create CI local.properties
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p .ci
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci/release-keystore.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.ci/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and name APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_source="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk_source"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            apk_name="Audiophile-${GITHUB_REF_NAME}-release.apk"
          else
            apk_name="Audiophile-${GITHUB_SHA:0:7}-release.apk"
          fi
          mkdir -p release-artifact
          cp "$apk_source" "release-artifact/$apk_name"
          test -s "release-artifact/$apk_name"
          echo "name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiophile-apk-${{ github.run_id }}
          path: release-artifact/${{ steps.apk.outputs.name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: audiophile-apk-${{ github.run_id }}
          path: release-artifact

      - name: Verify downloaded APK
        shell: bash
        run: test -s "release-artifact/${{ needs.build.outputs.apk_name }}"

      - name: Create GitHub Release and attach APK
        uses: actions/github-script@v7
        env:
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const assetName = process.env.APK_NAME;
            const assetPath = path.join('release-artifact', assetName);
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Audiophile ${context.ref.replace('refs/tags/', '')}`,
              generate_release_notes: true
            });
            const asset = fs.readFileSync(assetPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: assetName,
              data: asset,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': asset.length
              }
            });